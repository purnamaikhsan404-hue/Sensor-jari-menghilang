<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Snap Invisible Body Effect</title>
    
    <!-- Load Library MediaPipe & Drawing Utils via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #input-video {
            display: none; /* Video kamera mentah disembunyikan */
        }

        #output-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mode Cermin (Mirroring) */
        }

        /* Status UI Info */
        .status-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            z-index: 10;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="status-badge" id="status-text">👌 JENTIKKAN JARI (PINCH) UNTUK MENGHILANGKAN BADAN</div>
        <video id="input-video" autoplay playsinline></video>
        <canvas id="output-canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        let isBodyInvisible = false;
        let lastPinchState = false;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 1. DETEKSI GESTUR JENTIKAN JARI / PINCH (Ibu jari & Jari Tengah) ---
        function detectSnapGesture(landmarks) {
            // Landmark 4: Ujung Ibu Jari (Thumb Tip)
            // Landmark 12: Ujung Jari Tengah (Middle Finger Tip)
            const thumbTip = landmarks[4];
            const middleTip = landmarks[12];

            // Hitung jarak Euclidean antara ibu jari dan jari tengah
            const distance = Math.hypot(thumbTip.x - middleTip.x, thumbTip.y - middleTip.y, thumbTip.z - middleTip.z);

            // Jika jarak sangat dekat (< 0.05), terdeteksi sebagai sentuhan/jepitan jentikan
            return distance < 0.05;
        }

        // --- 2. PEMPROSESAN FRAME DAN HASIL AI ---
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            let pinchDetected = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    if (detectSnapGesture(landmarks)) {
                        pinchDetected = true;
                    }
                }
            }

            // Logika saklar (Toggle): Menjentikkan jari akan mengganti mode
            if (pinchDetected && !lastPinchState) {
                isBodyInvisible = !isBodyInvisible; // Balikkan status menghilang
            }
            lastPinchState = pinchDetected;

            // RENDER TAMPILAN
            if (isBodyInvisible) {
                // EFEK BADAN MENGHILANG: Isi background dengan warna hitam pekat
                canvasCtx.fillStyle = '#000000';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                
                statusText.innerText = "STATUS: BADAN MENGHILANG (MODE SENSOR TANGAN)";
                statusText.style.borderColor = "#ff0055";
                statusText.style.color = "#ff0055";
            } else {
                // TAMPILAN NORMAL: Tampilkan video kamera asli
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                
                statusText.innerText = "👌 JENTIKKAN JARI UNTUK MENGHILANGKAN BADAN";
                statusText.style.borderColor = "#00ffcc";
                statusText.style.color = "#00ffcc";
            }

            // GAMBAR SENSOR / SKELETON TANGAN DI ATASNYA
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Garis Penghubung (Skeleton Putih)
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {
                        color: '#ffffff',
                        lineWidth: 3
                    });
                    
                    // Titik Sensor (Sendi Hijau Neon)
                    drawLandmarks(canvasCtx, landmarks, {
                        color: '#00ff66',
                        fillColor: '#00ff66',
                        radius: 5
                    });
                }
            }

            canvasCtx.restore();
        }

        // --- 3. INISIALISASI MEDIAPIPE HANDS ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        window.addEventListener('load', () => {
            camera.start().catch(err => {
                statusText.innerText = "CAMERA ERROR: PASTIKAN GUNAKAN HTTPS";
                console.error(err);
            });
        });
    </script>
</body>
</html>
